use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - wikipedia
general:
  instance_name: Vastar local search
search:
  formats: [html, json]
  autocomplete: ""
server:
  limiter: false
  public_instance: false
outgoing:
  request_timeout: 8
  max_request_timeout: 15
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
